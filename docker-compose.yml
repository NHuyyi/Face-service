services:
  face-service:
    build: .
    container_name: face-recognition-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      DETECTOR_BACKEND: retinaface           # scrfd hoặc retinaface
      MATCH_THRESHOLD: "0.40"
      VECTOR_TTL_SECONDS: "300"         # Lưu tạm thời vector trong 300s (5 phút)
      API_KEY: "my-secret-key-2026"                       # chuối khoá bí mật
    volumes:
      - ./models:/srv/models:ro         # Mount thư mục model vào container
      - ./data:/srv/data                # Mount thư mục CSDL SQLite lưu vector
